[project]
name = "tch-motor"
version = "0.1.0"
description = "Motor de estimados de TCH (Riopaila): satélite + agronomía + aforo, con recalibración por campaña."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
